<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTasks - Usuarios</title>

    <link rel="stylesheet" href="user.css">
</head>
<body>

    <header class="header">
        <div class="container header-content">
            <h1 class="logo">DevTasks</h1>

            <nav class="nav">
                <a href="user.html" class="active">Home</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">

                <h2>Usuarios</h2>

                <p>
                   Cadastre os Usuarios do DevTasks no sistema, para que possam acessar e utilizar a aplicação.
                </p>

            </div>
        </section>

        <section class="features">
            <div class="cadastrar">
                <h2>Cadastro</h2>

                <p>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" placeholder="Digite seu nome...">
                </p>

                <p>
                    <label for="email">Email:</label>
                    <input type="text" id="email" placeholder="Digite seu email...">
                </p>

                <p>
                 <button class="button primary">Adicionar Usuario</button>
                </p>

                </div>
                <div class="cadastros">
                    <p>
                        Usuarios cadastrados:
                    </p>
                    <p>
                        - João Silva    Joao.silva@email.com
                    </p>
                    <p>
                        - Maria Oliveira    maria.oliveira@email.com
                    </p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>
                &copy; 2026 DevTasks. Projeto desenvolvido para fins educacionais.
            </p>
        </div>
    </footer>

</body>
</html>
